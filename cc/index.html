<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Control Center</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
  <link rel="stylesheet" href="hub.css">
  <link rel="stylesheet" href="online.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#F1EADF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Control Center">
  <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
  <div class="shell">
    <nav class="rail" aria-label="Apps">
      <a class="brand" href="#home" data-app="home">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="4" y="4" width="10" height="10" rx="2.5"/><rect x="18" y="4" width="10" height="10" rx="2.5"/><rect x="4" y="18" width="10" height="10" rx="2.5"/><rect x="18" y="18" width="10" height="10" rx="2.5" class="fill"/></svg>
        <span>Control Center</span>
      </a>
      <ul class="nav" id="nav"></ul>
      <button class="collapse-btn" id="collapseBtn" type="button" aria-label="Make the menu smaller" title="Make the menu smaller">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg><span class="label">Hide labels</span>
      </button>
      <div class="rail-resize" id="railResize" role="separator" aria-orientation="vertical" aria-label="Drag to resize the menu" title="Drag to resize · double-click to reset"></div>
    </nav>

    <main class="stage" id="stage">
      <section class="home" id="home" aria-labelledby="homeTitle">
        <header class="home-head">
          <div>
            <p class="eyebrow" id="today"></p>
            <h1 id="homeTitle">Good day</h1>
          </div>
          <button class="btn ghost" id="refreshAll" type="button">Refresh</button>
        </header>
        <div class="cards" id="cards"></div>
      </section>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="cloud.js"></script>
  <script src="online.js"></script>
  <script src="alerts.js"></script>
  <script type="module" src="hub.js"></script>
</body>
</html>
